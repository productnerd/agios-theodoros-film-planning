<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agios Theodoros Filming Matrix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap');

:root {
  --cream: #f3e9d7;
  --cream-deep: #e7dcc3;
  --paper: #faf5ea;
  --paper-hover: #fdf9ef;
  --espresso: #2a1810;
  --espresso-soft: #5a4533;
  --terracotta: #8b1a4a;
  --terracotta-soft: #d4729c;
  --olive: #6b7c4a;
  --line: #cdbfa3;
  --line-soft: #e6dcc6;
  --shadow: 0 1px 3px rgba(42, 24, 16, 0.06), 0 2px 8px rgba(42, 24, 16, 0.04);
  --unlocked: #4a7c5a;
  --unlocked-bg: #e6f5eb;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--espresso);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page {
  padding: 36px 28px 80px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.kicker {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--terracotta);
  font-weight: 600;
  margin: 0 0 10px;
}

h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 44px;
  letter-spacing: -0.025em;
  margin: 0 0 14px;
  line-height: 1.05;
}

h1 em {
  font-style: italic;
  color: var(--terracotta);
  font-weight: 400;
}

.lede {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 17px;
  font-weight: 400;
  color: var(--espresso-soft);
  line-height: 1.55;
  margin: 0 0 22px;
  max-width: 660px;
}

.legend {
  display: flex;
  gap: 24px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--espresso-soft);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.mark-glyph {
  display: inline-flex;
  width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.mark-glyph.feat {
  background: var(--terracotta);
  color: var(--paper);
}

.mark-glyph.cameo {
  background: var(--cream-deep);
  color: var(--espresso);
  border: 1px solid var(--line);
}

.mark-glyph.skip {
  background: transparent;
  color: var(--line);
  border: 1px dashed var(--line);
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}

.btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--espresso);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn:hover {
  background: var(--cream-deep);
  border-color: var(--espresso-soft);
}

.btn-primary {
  background: var(--espresso);
  color: var(--paper);
  border-color: var(--espresso);
}

.btn-primary:hover {
  background: var(--espresso-soft);
  border-color: var(--espresso-soft);
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--espresso-soft);
}

.btn-ghost:hover {
  background: var(--cream-deep);
  color: var(--espresso);
}

.status {
  margin-left: auto;
  font-size: 12.5px;
  color: var(--olive);
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  padding-right: 4px;
}

.table-wrap {
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  overflow: auto;
  max-height: 72vh;
  box-shadow: var(--shadow);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--cream-deep);
  color: var(--espresso);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 11px;
  padding: 12px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: bottom;
  z-index: 5;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--espresso-soft);
}

thead th.format-col {
  text-align: center;
  min-width: 92px;
  max-width: 110px;
  white-space: normal;
  line-height: 1.25;
}

thead th.format-col .col-label {
  display: block;
  margin-bottom: 5px;
  outline: none;
  border-radius: 3px;
  padding: 2px 4px;
  cursor: text;
}

thead th.format-col .col-label:focus {
  background: #fff8e6;
  box-shadow: inset 0 0 0 1px var(--terracotta);
}

th.format-col .col-count {
  display: block;
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: 11px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--terracotta);
}

th.row-num-col {
  width: 38px;
  min-width: 38px;
  max-width: 38px;
  text-align: center;
  position: sticky;
  left: 0;
  z-index: 6;
}

th.location-col {
  position: sticky;
  left: 38px;
  z-index: 6;
  min-width: 230px;
  background: var(--cream-deep);
}

th.notes-col {
  min-width: 200px;
  max-width: 260px;
}

th.actions-col {
  width: 36px;
}

tbody tr.cat-row td {
  background: var(--cream);
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--terracotta);
  padding: 8px 10px 4px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  left: 0;
  z-index: 2;
}

tbody td {
  padding: 4px 8px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
  background: var(--paper);
}

tbody tr:hover td {
  background: var(--paper-hover);
}

td.row-num {
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  color: var(--espresso-soft);
  font-size: 12px;
  width: 38px;
  min-width: 38px;
  max-width: 38px;
  text-align: center;
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--cream-deep);
}

tbody tr:hover td.row-num {
  background: var(--cream-deep);
}

td.location-cell {
  position: sticky;
  left: 38px;
  z-index: 2;
  min-width: 230px;
  background: var(--paper);
  border-right: 1px solid var(--line-soft);
}

tbody tr:hover td.location-cell {
  background: var(--paper-hover);
}

.cell-edit {
  outline: none;
  border-radius: 4px;
  padding: 2px 4px;
  cursor: text;
}

.cell-edit:focus {
  background: #fff8e6;
  box-shadow: inset 0 0 0 1px var(--terracotta);
}

td.location-cell .cell-edit {
  font-weight: 500;
  font-size: 13.5px;
  font-family: 'Fraunces', Georgia, serif;
  color: var(--espresso);
}

td.location-cell .loc-notes {
  font-weight: 400;
  font-size: 11px;
  font-family: 'Inter', sans-serif;
  color: var(--espresso-soft);
  margin-top: 1px;
  line-height: 1.2;
}

td.notes {
  font-size: 12px;
  color: var(--espresso-soft);
  font-style: italic;
  font-family: 'Fraunces', Georgia, serif;
  min-width: 200px;
  max-width: 260px;
}

td.notes .cell-edit {
  font-size: 12.5px;
  line-height: 1.3;
  min-height: 18px;
}

td.mark-cell {
  text-align: center;
  padding: 2px 4px;
}

.mark-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px dashed transparent;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--line);
  font-family: 'Inter', sans-serif;
  transition: all 0.15s ease;
}

.mark-btn:hover {
  border-color: var(--line);
  background: rgba(198, 106, 58, 0.06);
}

.mark-btn[data-mark="1"] {
  background: var(--cream-deep);
  color: var(--espresso);
  border: 1px solid var(--line);
  border-style: solid;
}

.mark-btn[data-mark="2"] {
  background: #f5c6d8;
  color: #5a1035;
  border: 1px solid #e8a0bc;
}

td.actions-cell {
  width: 36px;
  text-align: center;
  padding: 4px;
}

.icon-btn {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--espresso-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all 0.15s ease;
  font-size: 16px;
  line-height: 1;
}

tr:hover .icon-btn {
  opacity: 1;
}

.icon-btn:hover {
  background: var(--cream-deep);
  color: var(--terracotta);
}

th .col-actions {
  display: flex;
  justify-content: center;
  gap: 2px;
  margin-top: 2px;
}

.filmed-toggle {
  width: 15px;
  height: 15px;
  accent-color: var(--unlocked);
  cursor: pointer;
  vertical-align: middle;
  margin-right: 5px;
  flex-shrink: 0;
}

.location-cell .loc-wrap {
  display: flex;
  align-items: flex-start;
  gap: 0;
}

tr[data-filmed="true"] td.location-cell .cell-edit {
  text-decoration: line-through;
  opacity: 0.55;
}

tr[data-filmed="true"] td.location-cell .loc-notes {
  opacity: 0.45;
}

.col-remaining {
  display: block;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 9.5px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--espresso-soft);
  margin-top: 2px;
}

.col-remaining.unlocked {
  color: var(--unlocked);
  font-weight: 600;
}

th.format-col.unlocked {
  background: var(--unlocked-bg);
}

th.format-col.unlocked .col-label {
  color: var(--unlocked);
}

th .col-actions .icon-btn {
  opacity: 0;
}

th.format-col:hover .col-actions .icon-btn {
  opacity: 0.8;
}

.dialog-bg {
  position: fixed;
  inset: 0;
  background: rgba(42, 24, 16, 0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(2px);
}

.dialog-bg.open {
  display: flex;
}

.dialog {
  background: var(--paper);
  border-radius: 12px;
  padding: 28px;
  width: 90%;
  max-width: 460px;
  box-shadow: 0 12px 40px rgba(42, 24, 16, 0.3);
  font-family: 'Inter', sans-serif;
}

.dialog h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 24px;
  margin: 0 0 18px;
  letter-spacing: -0.01em;
}

.dialog label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--espresso-soft);
  margin-bottom: 6px;
  font-weight: 600;
  margin-top: 4px;
}

.dialog input, .dialog select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  background: var(--cream);
  margin-bottom: 14px;
  color: var(--espresso);
  outline: none;
}

.dialog input:focus, .dialog select:focus {
  border-color: var(--terracotta);
  background: #fff8e6;
}

.dialog-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 14px;
}

.footer-note {
  margin-top: 22px;
  padding: 14px 18px;
  background: var(--paper);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  font-family: 'Fraunces', Georgia, serif;
  font-style: italic;
  font-size: 13.5px;
  color: var(--espresso-soft);
  line-height: 1.55;
}

.footer-note strong {
  font-weight: 600;
  font-style: normal;
  font-family: 'Inter', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--terracotta);
  display: block;
  margin-bottom: 6px;
}

@media (max-width: 720px) {
  .page { padding: 24px 16px 60px; }
  h1 { font-size: 32px; }
  .lede { font-size: 15px; }
  .legend { gap: 14px; font-size: 11.5px; }
  .toolbar { padding: 10px; }
  .btn { font-size: 12px; padding: 7px 11px; }
  .status { width: 100%; margin-left: 0; text-align: right; order: 99; }
}
</style>
</head>

async function sbLoad() {
  try {

      `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${ROW_ID}&select=state`,

    console.warn('Supabase load failed, using defaults', e);

}

async function sbSave() {

      `${SUPABASE_URL}/rest/v1/${TABLE}`,

let state = { rows: cloneRows(defaultRows), columns: defaultColumns.map(c => ({...c})) };

function cloneRows(arr) {
  return arr.map(r => ({...r, marks: {...r.marks}, interview: r.interview || '', filmed: r.filmed || false}));
}

async function load() {
  await sbLoad();
  render();
}

let saveTimer = null;
function scheduleSave() {
  const status = document.getElementById('status');
  status.textContent = 'Saving…';
  status.style.color = 'var(--terracotta)';
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await sbSave();
    if (ok) {
      status.textContent = 'All changes saved';
      status.style.color = 'var(--olive)';
    } else {
      status.textContent = 'Save failed — try again';
      status.style.color = 'var(--terracotta)';
    }
  }, 350);
}

function markGlyph(v) {
  return v === 2 ? '★' : v === 1 ? '●' : '·';
}

            <span class="col-label" contenteditable="true" data-col="${i}">${c.label}</span>
            <span class="col-count" id="count-${c.id}"></span>
            <span class="col-remaining" id="remaining-${c.id}"></span>
            <div class="col-actions">
              <button class="icon-btn" data-action="remove-col" data-idx="${i}" title="Remove this column">×</button>
            </div>
          </th>`).join('')}
        <th class="notes-col">Activities</th>
        <th class="notes-col">Props</th>
        <th class="notes-col">Interview</th>
        <th class="actions-col"></th>
      </tr>
    </thead>`;

  const grouped = {};
  state.rows.forEach((row, idx) => {
    if (!grouped[row.category]) grouped[row.category] = [];
    grouped[row.category].push({row, idx});
  });

  const totalCols = state.columns.length + 6;
  let bodyHtml = '<tbody>';
  let visibleNum = 0;
  Object.keys(grouped).forEach(cat => {
    bodyHtml += `<tr class="cat-row"><td colspan="${totalCols}">${escapeHtml(cat)}</td></tr>`;
    grouped[cat].forEach(({row, idx}) => {
      visibleNum++;
      bodyHtml += `
        <tr data-row-idx="${idx}" data-filmed="${row.filmed ? 'true' : 'false'}">
          <td class="row-num">${visibleNum}</td>
          <td class="location-cell">
            <div class="loc-wrap">
              <input type="checkbox" class="filmed-toggle" data-idx="${idx}" ${row.filmed ? 'checked' : ''} title="Mark as filmed">
              <div>
                <div class="cell-edit" contenteditable="true" data-field="name" data-idx="${idx}">${row.name}</div>
                ${row.notes ? `<div class="loc-notes cell-edit" contenteditable="true" data-field="notes" data-idx="${idx}">${row.notes}</div>` : ''}
              </div>
            </div>
          </td>
          ${state.columns.map(c => `
            <td class="mark-cell">
              <button class="mark-btn" data-mark="${row.marks[c.id] || 0}" data-idx="${idx}" data-col="${c.id}" aria-label="Toggle mark">${markGlyph(row.marks[c.id] || 0)}</button>
            </td>`).join('')}
          <td class="notes">
            <div class="cell-edit" contenteditable="true" data-field="activity" data-idx="${idx}">${row.activity || ''}</div>
          </td>
          <td class="notes">
            <div class="cell-edit" contenteditable="true" data-field="props" data-idx="${idx}">${row.props || ''}</div>
          </td>
          <td class="notes">
            <div class="cell-edit" contenteditable="true" data-field="interview" data-idx="${idx}">${row.interview || ''}</div>
          </td>
          <td class="actions-cell">
            <button class="icon-btn" data-action="remove-row" data-idx="${idx}" title="Remove this location">×</button>
          </td>
        </tr>`;
    });
  });
  bodyHtml += '</tbody>';

  table.innerHTML = thHead + bodyHtml;

  table.querySelectorAll('.mark-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const col = btn.dataset.col;
      const current = state.rows[idx].marks[col] || 0;
      const next = (current + 1) % 3;
      state.rows[idx].marks[col] = next;
      btn.dataset.mark = next;
      btn.textContent = markGlyph(next);
      updateCounts();
      scheduleSave();
    });
  });

  table.querySelectorAll('.filmed-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      const idx = parseInt(cb.dataset.idx);
      state.rows[idx].filmed = cb.checked;
      cb.closest('tr').dataset.filmed = cb.checked ? 'true' : 'false';
      updateCounts();
      scheduleSave();
    });
  });

  table.querySelectorAll('.cell-edit').forEach(el => {
    el.addEventListener('input', () => {
      const field = el.dataset.field;
      const col = el.dataset.col;
      if (field) {
        const idx = parseInt(el.dataset.idx);
        state.rows[idx][field] = el.textContent;
      } else if (col !== undefined) {
        state.columns[parseInt(col)].label = el.textContent;
      }
      scheduleSave();
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    });
  });

  table.querySelectorAll('[data-action="remove-row"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (!confirm(`Remove "${state.rows[idx].name}" from the matrix?`)) return;
      state.rows.splice(idx, 1);
      render();
      scheduleSave();
    });
  });

  table.querySelectorAll('[data-action="remove-col"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (!confirm(`Remove the "${state.columns[idx].label}" format from the matrix?`)) return;
      state.columns.splice(idx, 1);
      render();
      scheduleSave();
    });
  });

  updateCounts();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function updateCounts() {
  state.columns.forEach(c => {
    const el = document.getElementById(`count-${c.id}`);
    const remEl = document.getElementById(`remaining-${c.id}`);
    const th = document.querySelector(`th[data-col-id="${c.id}"]`);
    if (!el) return;
    const feats = state.rows.filter(r => r.marks[c.id] === 2).length;
    const cameos = state.rows.filter(r => r.marks[c.id] === 1).length;
    el.textContent = `${feats}★ · ${cameos}●`;

    // Count locations involved in this video (mark >= 1) that are not yet filmed
    const involved = state.rows.filter(r => (r.marks[c.id] || 0) === 2);
    const notFilmed = involved.filter(r => !r.filmed).length;
    if (remEl) {
      if (involved.length === 0) {
        remEl.textContent = '';
        remEl.className = 'col-remaining';
      } else if (notFilmed === 0) {
        remEl.textContent = '✓ ready to edit';
        remEl.className = 'col-remaining unlocked';
      } else {
        remEl.textContent = `${notFilmed} location${notFilmed > 1 ? 's' : ''} left`;
        remEl.className = 'col-remaining';
        remEl.title = involved.filter(r => !r.filmed).map(r => r.name).join('\n');
      }
    }
    if (th) {
      th.classList.toggle('unlocked', involved.length > 0 && notFilmed === 0);
    }
  });
}

document.getElementById('add-row').addEventListener('click', () => {
  const cats = [...new Set(state.rows.map(r => r.category))];
  const dialogBg = document.getElementById('dialog-bg');
  const dialog = document.getElementById('dialog');
  dialog.innerHTML = `
    <h2>Add location</h2>
    <label>Name</label>
    <input type="text" id="new-name" placeholder="e.g. Pentaschinos river bridge">
    <label>Category</label>
    <select id="new-category">
      ${cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      <option value="__new__">+ New category…</option>
    </select>
    <label>Notes (optional)</label>
    <input type="text" id="new-notes" placeholder="Short description of the place">
    <label>Activity (optional)</label>
    <input type="text" id="new-activity" placeholder="e.g. picking oranges, tasting olive oil">
    <label>Props (optional)</label>
    <input type="text" id="new-props" placeholder="e.g. basket, blanket, sunscreen">
    <label>Interview questions (optional)</label>
    <input type="text" id="new-interview" placeholder="e.g. What is your specialty?">
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="cancel-add">Cancel</button>
      <button class="btn btn-primary" id="confirm-add">Add location</button>
    </div>
  `;
  dialogBg.classList.add('open');
  setTimeout(() => document.getElementById('new-name').focus(), 50);

  document.getElementById('new-category').addEventListener('change', (e) => {
    if (e.target.value === '__new__') {
      const newCat = prompt('New category name:');
      if (newCat && newCat.trim()) {
        const opt = document.createElement('option');
        opt.value = newCat.trim();
        opt.textContent = newCat.trim();
        opt.selected = true;
        e.target.insertBefore(opt, e.target.querySelector('option[value="__new__"]'));
      } else {
        e.target.value = cats[0] || '';
      }
    }
  });

  document.getElementById('cancel-add').addEventListener('click', closeDialog);
  document.getElementById('confirm-add').addEventListener('click', () => {
    const name = document.getElementById('new-name').value.trim();
    if (!name) { document.getElementById('new-name').focus(); return; }
    const category = document.getElementById('new-category').value;
    const notes = document.getElementById('new-notes').value.trim();
    const activity = document.getElementById('new-activity').value.trim();
    const props = document.getElementById('new-props').value.trim();
    const interview = document.getElementById('new-interview').value.trim();
    const marks = {};
    state.columns.forEach(c => marks[c.id] = 0);
    state.rows.push({
      id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36),
      category, name, notes, marks, activity, props, interview
    });
    closeDialog();
    render();
    scheduleSave();
  });
});

document.getElementById('add-col').addEventListener('click', () => {
  const dialogBg = document.getElementById('dialog-bg');
  const dialog = document.getElementById('dialog');
  dialog.innerHTML = `
    <h2>Add video format</h2>
    <label>Format name</label>
    <input type="text" id="new-col-name" placeholder="e.g. Reels for first-time visitors">
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="cancel-add-col">Cancel</button>
      <button class="btn btn-primary" id="confirm-add-col">Add format</button>
    </div>
  `;
  dialogBg.classList.add('open');
  setTimeout(() => document.getElementById('new-col-name').focus(), 50);

  document.getElementById('cancel-add-col').addEventListener('click', closeDialog);
  document.getElementById('confirm-add-col').addEventListener('click', () => {
    const label = document.getElementById('new-col-name').value.trim();
    if (!label) { document.getElementById('new-col-name').focus(); return; }
    const id = 'col_' + Date.now().toString(36);
    state.columns.push({ id, label });
    state.rows.forEach(r => r.marks[id] = 0);
    closeDialog();
    render();
    scheduleSave();
  });
});

function closeDialog() {
  document.getElementById('dialog-bg').classList.remove('open');
}

document.getElementById('dialog-bg').addEventListener('click', (e) => {
  if (e.target.id === 'dialog-bg') closeDialog();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDialog();
});

document.getElementById('export-csv').addEventListener('click', () => {
  const headerRow = ['Category', 'Location', 'Notes', ...state.columns.map(c => c.label), 'Activities', 'Props', 'Interview'];
  const rows = [headerRow];
  state.rows.forEach(r => {
    rows.push([
      r.category,
      r.name,
      r.notes || '',
      ...state.columns.map(c => {
        const v = r.marks[c.id] || 0;
        return v === 2 ? 'FEATURE' : v === 1 ? 'cameo' : '';
      }),
      r.activity || '',
      r.props || '',
      r.interview || ''
    ]);
  });
  const csv = rows.map(row => row.map(cell => {
    const s = String(cell).replace(/&amp;/g, '&').replace(/<[^>]+>/g, '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'agios-theodoros-filming-matrix.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Reset to Kaimakki default suggestions? Your edits will be lost.')) return;
  state = { rows: cloneRows(defaultRows), columns: defaultColumns.map(c => ({...c})) };
  render();
  scheduleSave();
});

load();
</script>
</body>
</html>
